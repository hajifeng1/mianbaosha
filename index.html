#mulligan-panel{display:none;position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:rgba(20,20,30,.95);border:2px solid #f1c40f;border-radius:12px;padding:12px 20px;z-index:99997;text-align:center;box-shadow:0 -4px 20px rgba(0,0,0,.6);backdrop-filter:blur(8px);min-width:280px;animation:slideUp .3s ease-out}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
#mulligan-panel .mulligan-title{font-size:16px;font-weight:bold;color:#f1c40f;margin-bottom:6px}
#mulligan-panel .mulligan-desc{font-size:12px;color:#bdc3c7;margin-bottom:10px;line-height:1.4}
#mulligan-panel .mulligan-btns{display:flex;gap:12px;justify-content:center}
#mulligan-panel .mulligan-btns button{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer;color:#fff;transition:all .2s;min-width:100px}
#mulligan-panel .mulligan-btns button:active{transform:scale(.95)}
.btn-mulligan-keep{background:linear-gradient(to bottom,#27ae60,#2ecc71)}
.btn-mulligan-redraw{background:linear-gradient(to bottom,#e67e22,#f39c12)}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.7}}
</style>

<body>
<div id="auth-modal"><div class="auth-box"><h2>🍞 面包杀</h2><input type="email" id="email" placeholder="邮箱" autocomplete="email"><input type="password" id="password" placeholder="密码（至少6位）" autocomplete="current-password"><button class="btn-login" onclick="handleLogin()">登 录</button><button class="btn-register" onclick="handleRegister()">注 册</button><div style="margin-top:8px;"><a href="javascript:void(0)" onclick="handleForgotPassword()" style="color:#bdc3c7;font-size:13px;text-decoration:underline;cursor:pointer;">忘记密码？点击找回</a></div><div class="auth-msg" id="auth-msg"></div></div><div class="auth-footer">🍞 面包护卫队出品</div></div>
<div id="rename-modal"><div class="modal-box"><h3>✏️ 修改游戏昵称</h3><input type="text" id="rename-input" placeholder="输入新昵称" maxlength="12"><div style="font-size:11px;color:#95a5a6;margin-bottom:14px;">1~12个字符，支持中文/英文/数字</div><div class="modal-btns"><button class="btn-cancel" onclick="closeModalEl('rename-modal')">取消</button><button class="btn-confirm" onclick="confirmRename()">确认修改</button></div><div class="modal-msg" id="rename-msg"></div></div></div>
<div id="uid-modal"><div class="modal-box"><h3>🆔 我的 UID</h3><div class="uid-display"><span id="uid-text">加载中...</span><button class="btn-copy" onclick="copyUID()">📋 复制</button></div><div class="modal-msg" id="uid-msg" style="color:#2ecc71;"></div><div class="modal-btns"><button class="btn-cancel" onclick="closeModalEl('uid-modal')">关闭</button></div></div></div>
<div id="remark-modal"><div class="modal-box"><h3>📝 修改备注</h3><input type="text" id="remark-input" placeholder="输入新备注" maxlength="12"><div class="modal-btns"><button class="btn-cancel" onclick="closeModalEl('remark-modal')">取消</button><button class="btn-confirm" onclick="saveRemark()">保存</button></div></div></div>
<div id="friends-modal"><div class="modal-box" style="width:380px;"><h3>🤝 好友系统</h3><div class="tabs"><div class="tab active" id="tab-list" onclick="switchFriendTab('list')">好友列表</div><div class="tab" id="tab-req" onclick="switchFriendTab('req')">好友申请 <span id="req-badge-tab" style="color:#e74c3c;display:none;">(0)</span></div><div class="tab" id="tab-add" onclick="switchFriendTab('add')">添加好友</div></div><div id="panel-list"><div class="friend-list" id="friend-list-container"><div style="color:#7f8c8d;text-align:center;padding:20px;">加载中...</div></div></div><div id="panel-req" style="display:none;"><div class="friend-list" id="req-list-container"><div style="color:#7f8c8d;text-align:center;padding:20px;">加载中...</div></div></div><div id="panel-add" style="display:none;"><input type="text" id="add-uid-input" placeholder="输入对方的完整 UID" style="font-size:13px;text-align:left;"><div class="modal-btns"><button class="btn-primary" onclick="sendFriendRequest()">发送申请</button></div><div class="modal-msg" id="add-msg"></div></div><div class="modal-btns" style="margin-top:20px;"><button class="btn-cancel" onclick="closeModalEl('friends-modal')">关闭</button></div></div></div>
<div id="card-tooltip"><div class="tt-name"></div><div class="tt-type"></div><div class="tt-desc"></div><div class="tt-wangsheng"></div></div>
<div id="mulligan-panel"><div class="mulligan-title">🃏 起手调度</div><div class="mulligan-desc">查看下方手牌，选择保留或全部重摸<br>(之后还会再摸2张进入回合)</div><div class="mulligan-btns"><button class="btn-mulligan-keep" onclick="mulliganKeep()">✅ 保留</button><button class="btn-mulligan-redraw" onclick="mulliganRedraw()">🔄 换一批</button></div></div>
<div id="game-wrapper" style="display:none;width:100%;height:100%;">
<div id="lobby-page" class="page active"><div class="top-bar"><div class="user-info"><div class="avatar" id="lobby-avatar" onclick="openAvatarMenu()" title="点击管理账号">👤</div><div><h3 style="margin:0;" id="lobby-player-name">玩家</h3><span style="font-size:12px;color:#aaa;">LV.<span id="lobby-level">1</span> <span id="lobby-rank-badge" class="rank-badge">无段位</span><span id="lobby-rank-change" class="rank-change"></span></span></div></div><button class="btn-logout" onclick="handleLogout()">退出登录</button></div><div class="main-content"><button class="big-btn btn-match" onclick="enterHeroSelect('match')">匹配</button><button class="big-btn btn-rank" onclick="enterHeroSelect('rank')">排位</button></div><div class="bottom-nav"><div class="nav-item" onclick="showHeroesPage()"><i>⚔️</i>武将</div><div class="nav-item" onclick="openFriendsModal()"><i>🤝</i>好友<span class="nav-badge" id="req-badge-nav" style="display:none;">0</span></div><div class="nav-item"><i>🎒</i>背包</div></div></div>
<div id="heroes-page" class="page"><div class="heroes-header"><button class="btn-back" onclick="hideHeroesPage()">← 返回</button><h2 id="heroes-page-title">武将图鉴</h2></div><div class="heroes-grid" id="heroes-grid"></div><div class="heroes-footer" id="heroes-footer" style="display:none;"><button id="btn-confirm-game" class="btn-confirm-game btn-confirm-match" onclick="confirmStartGame()">开始匹配</button></div></div>
<div id="battle-page" class="page">
<div class="enemy-zone-wrap"><div class="enemy-portrait-small" id="enemy-portrait">👹</div><div class="enemy-details"><div class="player-name" id="enemy-hero-name">敌人</div><div><span class="hp" id="enemy-hp">❤️ 4/4</span></div><div class="hand-count">手牌数: <span id="enemy-hand-count">0</span></div><div class="zones-row" style="padding:3px 0 0;"><div class="equipment-zone" id="enemy-weapon"></div><div class="equipment-zone armor-zone" id="enemy-armor"></div><div class="judgment-zone" id="enemy-judgments"></div></div></div></div>
<div class="battle-mid"><div class="turn-counter">🔄 第 <span id="turn-number">1</span> 回合</div><div class="deck-info">📚 摸牌堆: <span id="draw-pile-count">0</span> | 🗑️ 弃牌堆: <span id="discard-pile-count">0</span></div><div id="phase-indicator"></div><div id="log">--- 欢迎来到战场 ---</div><div id="discard-tip"></div></div>
<div class="player-zone-wrap"><div class="player-top-row"><div class="player-portrait" id="my-portrait">🧑</div><div class="player-details"><div class="player-name" id="my-hero-name">我</div><div><span class="hp" id="my-hp">❤️ 4/4</span><span class="armor-info" id="my-armor"></span></div><div class="hand-limit-info">手牌上限: <span id="hand-limit">4</span></div><div class="player-passive-skills" id="passive-skills-display"></div></div></div><div class="zones-row"><div class="equipment-zone" id="my-weapon"></div><div class="equipment-zone armor-zone" id="my-armor-eq"></div><div class="judgment-zone" id="my-judgments"></div></div><div class="skills-bar" id="skills-bar"></div><div id="main-action-bar"><button id="btn-play" class="action-btn" onclick="playCard()">出牌</button><button id="btn-end" class="action-btn" onclick="endTurn()">结束回合</button><button id="btn-discard-confirm" class="action-btn" onclick="confirmDiscard()">确认弃牌</button></div><div id="hand-area"></div></div>
<div id="bottom-bar"><button id="btn-back-lobby" onclick="backToLobby()">退出对局</button></div>
</div>
</div>
<div id="response-modal"><div class="modal-content"><h2 id="modal-title" style="color:#e74c3c;margin-top:0;">提示</h2><p id="modal-desc">描述信息</p><div id="modal-buttons"></div><div id="modal-card-grid" class="card-grid"></div></div></div>
<script>
/* ========== Supabase & Auth ========== */
var SUPABASE_URL='https://xhehybtjnvyksjaznlla.supabase.co';
var SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhoZWh5YnRqbnZ5a3NqYXpubGxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAzMTEzMzMsImV4cCI6MjEwNTg4NzMzM30.-muF-1xOuKaAjHY0BYPgQpm2GFi62rPb0Fx33yYPbRM';
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:false,detectSessionInUrl:false}});
var currentUserId=null,authModal=document.getElementById('auth-modal'),gameWrapper=document.getElementById('game-wrapper'),authMsgEl=document.getElementById('auth-msg');
var userProfile={level:1,wins:0,losses:0,nickname:'',friends_remark:{}};
var isSavingProfile=false,currentRemarkUid='',isDataLoaded=false;
function openModalEl(id){document.getElementById(id).style.display='flex';}
function closeModalEl(id){document.getElementById(id).style.display='none';}
function showAuthMsg(t,tp){authMsgEl.textContent=t;authMsgEl.className='auth-msg '+tp;}
async function handleLogin(){var e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;if(!e||!p)return showAuthMsg('请填写邮箱和密码','error');showAuthMsg('⏳ 登录中...','');try{var r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)return showAuthMsg('❌ '+r.error.message,'error');showAuthMsg('✅ 登录成功！','success');}catch(err){console.error(err);showAuthMsg('❌ '+(err.message||String(err)),'error');}}
async function handleRegister(){var e=document.getElementById('email').value.trim(),p=document.getElementById('password').value;if(!e||!p)return showAuthMsg('请填写邮箱和密码','error');if(p.length<6)return showAuthMsg('密码至少6位','error');showAuthMsg('⏳ 注册中...','');try{var r=await sb.auth.signUp({email:e,password:p});if(r.error)return showAuthMsg('❌ '+r.error.message,'error');showAuthMsg('✅ 注册成功！请登录','success');}catch(err){console.error(err);showAuthMsg('❌ '+(err.message||String(err)),'error');}}
async function handleForgotPassword(){var e=document.getElementById('email').value.trim();if(!e)return showAuthMsg('请先填写注册时使用的邮箱','error');showAuthMsg('⏳ 正在发送重置邮件...','');try{var r=await sb.auth.resetPasswordForEmail(e);if(r.error)return showAuthMsg('❌ '+r.error.message,'error');showAuthMsg('✅ 重置邮件已发送！请查收邮箱','success');}catch(err){showAuthMsg('❌ '+(err.message||String(err)),'error');}}
async function handleLogout(){if(!isDataLoaded){alert('⚠️ 数据尚未加载完成，为防止数据丢失，请稍后再退出！');return;}var saved=await saveProfileToCloud();if(!saved){alert('⚠️ 保存失败，请重试！');return;}await sb.auth.signOut();}
sb.auth.onAuthStateChange(function(ev,ses){if(ev==='SIGNED_IN'&&ses){currentUserId=ses.user.id;isDataLoaded=false;authModal.style.display='none';gameWrapper.style.display='block';var ep=ses.user.email.split('@')[0];document.getElementById('lobby-player-name').setAttribute('data-email-prefix',ep);document.getElementById('lobby-player-name').innerText=ep;loadSaveFromCloud().then(function(){loadPendingRequests();try{sb.channel('friends-'+currentUserId).on('postgres_changes',{event:'*',schema:'public',table:'friend_requests',filter:'receiver_id=eq.'+currentUserId},function(){loadPendingRequests();}).subscribe();}catch(e){}});}else if(ev==='SIGNED_OUT'){currentUserId=null;isDataLoaded=false;userProfile={level:1,wins:0,losses:0,nickname:'',friends_remark:{}};updateLobbyRankUI();authModal.style.display='flex';gameWrapper.style.display='none';}});
async function saveProfileToCloud(){if(!currentUserId)return false;if(!isDataLoaded){console.warn('⚠️ 阻止保存：云端数据尚未加载完成，防止覆盖！');return false;}isSavingProfile=true;try{var res=await sb.from('user_saves').upsert({user_id:currentUserId,save_data:userProfile,updated_at:new Date().toISOString()},{onConflict:'user_id'});return !res.error;}catch(e){console.error('保存失败:',e);return false;}finally{isSavingProfile=false;}}
async function loadSaveFromCloud(){try{var r=await sb.from('user_saves').select('save_data').eq('user_id',currentUserId).maybeSingle();if(r.data&&r.data.save_data){var d=r.data.save_data;userProfile.level=typeof d.level==='number'?d.level:1;userProfile.wins=typeof d.wins==='number'?d.wins:0;userProfile.losses=typeof d.losses==='number'?d.losses:0;userProfile.nickname=typeof d.nickname==='string'?d.nickname:'';userProfile.friends_remark=typeof d.friends_remark==='object'&&d.friends_remark!==null?d.friends_remark:{};console.log('✅ 云端数据加载成功');}else{console.log('ℹ️ 云端无存档，使用默认数据');}}catch(e){console.error('❌ 加载云端数据失败:',e);return;}isDataLoaded=true;updateLobbyRankUI();updateAllNicknameDisplays();renderHeroesGrid();}
async function saveRankToCloud(w){if(!currentUserId)return;var ol=userProfile.level;if(w){userProfile.wins++;if(userProfile.level<100)userProfile.level++;}else{userProfile.losses++;if(userProfile.level>1)userProfile.level--;}updateLobbyRankUI(w?'+'+(userProfile.level-ol)+' 级':'-'+(ol-userProfile.level)+' 级');await saveProfileToCloud();}
function getDisplayNickname(){if(userProfile.nickname&&userProfile.nickname.trim())return userProfile.nickname.trim();var el=document.getElementById('lobby-player-name');return el?el.getAttribute('data-email-prefix')||'玩家':'玩家';}
function updateAllNicknameDisplays(){var name=getDisplayNickname();document.getElementById('lobby-player-name').innerText=name;var heroName=currentHero?currentHero.name:'';document.getElementById('my-hero-name').innerText=name+(heroName?' ('+heroName+')':'');}
function openAvatarMenu(){showModal('👤 账号管理','选择你要进行的操作：',[{text:'✏️ 修改昵称',color:'#3498db',action:function(){closeModal();openRenameModal();}},{text:'🆔 查看 UID',color:'#f39c12',action:function(){closeModal();openUIDModal();}},{text:'取消',color:'#7f8c8d',action:function(){closeModal();}}]);}
function openUIDModal(){document.getElementById('uid-text').innerText=currentUserId||'未登录';document.getElementById('uid-msg').innerText='';openModalEl('uid-modal');}
function copyUID(){if(!currentUserId)return;navigator.clipboard.writeText(currentUserId).then(function(){document.getElementById('uid-msg').innerText='✅ 已复制！';setTimeout(function(){document.getElementById('uid-msg').innerText='';},2000);}).catch(function(){});}
function openRenameModal(){document.getElementById('rename-input').value=userProfile.nickname||'';document.getElementById('rename-msg').innerText='';openModalEl('rename-modal');}
async function confirmRename(){var input=document.getElementById('rename-input');var msg=document.getElementById('rename-msg');var newName=input.value.trim();if(!newName){msg.innerText='❌ 昵称不能为空';msg.style.color='#e74c3c';return;}if(newName.length>12){msg.innerText='❌ 昵称最多12个字符';msg.style.color='#e74c3c';return;}msg.innerText='⏳ 保存中...';msg.style.color='#f1c40f';var old=userProfile.nickname;userProfile.nickname=newName;var ok=await saveProfileToCloud();if(!ok){userProfile.nickname=old;msg.innerText='❌ 保存失败';msg.style.color='#e74c3c';return;}msg.innerText='✅ 修改成功！';msg.style.color='#2ecc71';updateAllNicknameDisplays();setTimeout(function(){closeModalEl('rename-modal');},600);}
document.getElementById('rename-input').addEventListener('keydown',function(e){if(e.key==='Enter')confirmRename();});
function openFriendsModal(){openModalEl('friends-modal');switchFriendTab('list');loadPendingRequests();}
function switchFriendTab(tab){document.querySelectorAll('.tabs .tab').forEach(function(t){t.classList.remove('active');});document.getElementById('tab-'+tab).classList.add('active');document.getElementById('panel-list').style.display=tab==='list'?'block':'none';document.getElementById('panel-req').style.display=tab==='req'?'block':'none';document.getElementById('panel-add').style.display=tab==='add'?'block':'none';if(tab==='list')loadFriendList();if(tab==='req')loadReceivedRequests();}
async function loadFriendList(){var c=document.getElementById('friend-list-container');c.innerHTML='<div style="color:#7f8c8d;text-align:center;padding:20px;">加载中...</div>';var res=await sb.from('friend_requests').select('id,sender_id,receiver_id').eq('status','accepted').or('sender_id.eq.'+currentUserId+',receiver_id.eq.'+currentUserId);if(res.error||!res.data||res.data.length===0){c.innerHTML='<div style="color:#7f8c8d;text-align:center;padding:20px;">暂无好友</div>';return;}var friendIds=res.data.map(function(r){return r.sender_id===currentUserId?r.receiver_id:r.sender_id;});var profilesRes=await sb.from('user_saves').select('user_id,save_data').in('user_id',friendIds);var pm={};if(profilesRes.data)profilesRes.data.forEach(function(p){pm[p.user_id]=p.save_data&&p.save_data.nickname?p.save_data.nickname:'';});var html='';res.data.forEach(function(r,i){var fid=friendIds[i],rid=r.id,gn=pm[fid]||'玩家',rm=(userProfile.friends_remark&&userProfile.friends_remark[fid])?userProfile.friends_remark[fid]:gn;html+='<div class="friend-item"><div class="friend-info" onclick="openRemarkModal(\''+fid+'\',\''+rm.replace(/'/g,"\\'")+'\')"><div class="name">👤 '+rm+'</div>'+(rm!==gn?'<div class="game-name">游戏名: '+gn+'</div>':'')+'</div><div class="friend-actions"><button class="btn-primary" onclick="openRemarkModal(\''+fid+'\',\''+rm.replace(/'/g,"\\'")+'\')">备注</button><button class="btn-danger" onclick="deleteFriend(\''+rid+'\',\''+fid+'\')">删除</button></div></div>';});c.innerHTML=html;}
function openRemarkModal(uid,cr){currentRemarkUid=uid;document.getElementById('remark-input').value=cr;openModalEl('remark-modal');}
async function saveRemark(){var nr=document.getElementById('remark-input').value.trim();if(!nr){alert('备注不能为空');return;}if(!userProfile.friends_remark)userProfile.friends_remark={};userProfile.friends_remark[currentRemarkUid]=nr;await saveProfileToCloud();closeModalEl('remark-modal');loadFriendList();}
async function deleteFriend(reqId,fid){if(!confirm('确定删除该好友吗？'))return;await sb.from('friend_requests').delete().eq('id',reqId);if(userProfile.friends_remark&&userProfile.friends_remark[fid]){delete userProfile.friends_remark[fid];await saveProfileToCloud();}loadFriendList();}
async function loadReceivedRequests(){var c=document.getElementById('req-list-container');c.innerHTML='<div style="color:#7f8c8d;text-align:center;padding:20px;">加载中...</div>';var res=await sb.from('friend_requests').select('id,sender_id').eq('receiver_id',currentUserId).eq('status','pending');if(res.error||!res.data||res.data.length===0){c.innerHTML='<div style="color:#7f8c8d;text-align:center;padding:20px;">暂无新申请</div>';return;}var sids=res.data.map(function(r){return r.sender_id;});var pr=await sb.from('user_saves').select('user_id,save_data').in('user_id',sids);var pm={};if(pr.data)pr.data.forEach(function(p){pm[p.user_id]=p.save_data&&p.save_data.nickname?p.save_data.nickname:'玩家';});var html='';res.data.forEach(function(r){var n=pm[r.sender_id]||'玩家';html+='<div class="req-item"><div>👤 <span style="color:#f1c40f;">'+n+'</span></div><div class="req-actions"><button class="btn-accept" onclick="handleReq(\''+r.id+'\',\'accepted\',\''+r.sender_id+'\',\''+n.replace(/'/g,"\\'")+'\')">同意</button><button class="btn-reject" onclick="handleReq(\''+r.id+'\',\'rejected\')">拒绝</button></div></div>';});c.innerHTML=html;}
async function loadPendingRequests(){if(!currentUserId)return;var res=await sb.from('friend_requests').select('id',{count:'exact'}).eq('receiver_id',currentUserId).eq('status','pending');var count=res.count||0;var nb=document.getElementById('req-badge-nav'),tb=document.getElementById('req-badge-tab');if(count>0){nb.innerText=count;nb.style.display='block';tb.innerText='('+count+')';tb.style.display='inline';}else{nb.style.display='none';tb.style.display='none';}}
async function sendFriendRequest(){var uid=document.getElementById('add-uid-input').value.trim(),msg=document.getElementById('add-msg');msg.innerText='';msg.style.color='';if(!uid){msg.innerText='❌ 请输入UID';msg.style.color='#e74c3c';return;}if(uid===currentUserId){msg.innerText='❌ 不能添加自己';msg.style.color='#e74c3c';return;}if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(uid)){msg.innerText='❌ UID格式不正确';msg.style.color='#e74c3c';return;}msg.innerText='⏳ 发送中...';msg.style.color='#f1c40f';var res=await sb.from('friend_requests').insert({sender_id:currentUserId,receiver_id:uid});if(res.error){msg.innerText=res.error.code==='23505'?'⚠️ 已发送过或已是好友':'❌ '+res.error.message;msg.style.color='#e74c3c';}else{msg.innerText='✅ 申请已发送！';msg.style.color='#2ecc71';document.getElementById('add-uid-input').value='';}}

function triggerSkill_Chongsheng_AI(){
    if(gameState.hasUsedEnemyChongsheng) return;
    gameState.hasUsedEnemyChongsheng = true;
    var ph = HEROES.find(function(h){ return h.id === gameState.heroId; });
    var ps = ph ? ph.skills.filter(function(sk){ return sk.name !== '重生' && sk.name !== '超载模式'; }) : [];
    var banName = '无';
    if(ps.length > 0){
        var targetSkill = ps[Math.floor(Math.random() * ps.length)];
        banName = targetSkill.name;
        gameState.playerDisabledSkills.push(banName);
    }
    log('🔥 敌人【重生】发动！封禁你的 ['+banName+']！');
    gameState.enemyMaxHp -= 1;
    if(gameState.enemyHp > gameState.enemyMaxHp) gameState.enemyHp = gameState.enemyMaxHp;
    gameState.enemyHp = gameState.enemyMaxHp;
    gameState.enemyHasXianshangZuozhe = false;
    gameState.enemyHasChaozaiMoshi = true;
    log('🔥 敌人失去[线上作者]，获得[超载模式]！');
    renderBattle();
    checkWin();
}

function triggerSkill_Chongsheng(){if(gameState.hasUsedChongsheng)return;gameState.hasUsedChongsheng=true;var eh=HEROES.find(function(h){return h.id===gameState.enemyHeroId;});var es=eh?eh.skills.filter(function(sk){return sk.name!=='重生'&&sk.name!=='超载模式';}):[];var btns=es.map(function(sk){return{text:'封禁: '+sk.name,color:'#8e44ad',action:function(){gameState.enemyDisabledSkills.push(sk.name);log('🚫 【重生】封禁 ['+sk.name+']！');gameState.myMaxHp-=1;if(gameState.myHp>gameState.myMaxHp)gameState.myHp=gameState.myMaxHp;gameState.myHp=gameState.myMaxHp;gameState.hasXianshangZuozhe=false;gameState.hasChaozaiMoshi=true;log('🔥 失去[线上作者]，获得[超载模式]！');closeModal();renderBattle();checkWin();}};});btns.push({text:'放弃',color:'#7f8c8d',action:function(){closeModal();checkWin();}});showModal('🔥 限定技：重生','濒死！封禁敌方1技能，减1体力上限回满血，切换形态。',btns);}

function triggerSkill_Huamao(){
    if(gameState.hasUsedHuamao) return;
    if(gameState.myMaxHp <= 1) return; 
    gameState.hasUsedHuamao = true;
    gameState.myMaxHp -= 1;
    gameState.myHp = gameState.myMaxHp; 
    gameState.hasBanwei = false;
    gameState.hasMaoniang = true;
    log('🐱 【化猫】发动！失去体力上限，回满血，变身猫娘！');
    renderBattle();
    checkWin();
}

function promptForDying(){
    if(gameState.enemyHp <= 0 && !gameOver){
        if(gameState.enemyHeroId === 'xuyifeng' && !gameState.hasUsedEnemyChongsheng){
            log('🔥 敌人濒死，触发【重生】！');
            setTimeout(triggerSkill_Chongsheng_AI, 500);
            return; 
        }
        checkWin();
        return;
    }
    if(gameState.myHp>0)return;
    var pi=gameState.myHand.findIndex(function(c){return c.effect==='heal';}),wi=gameState.myHand.findIndex(function(c){return c.effect==='wine';}),btns=[];
    if(pi!==-1)btns.push({text:'使用【桃】自救',color:'#00b894',action:function(){var c=gameState.myHand.splice(pi,1)[0];discardCard(c);gameState.myHp=1;log('🍑 桃自救！');closeModal();renderBattle();}});
    if(wi!==-1)btns.push({text:'使用【酒】自救',color:'#6c5ce7',action:function(){var c=gameState.myHand.splice(wi,1)[0];discardCard(c);gameState.myHp=1;log('🍷 酒自救！');closeModal();renderBattle();}});
    if(gameState.heroId==='xuyifeng'&&!gameState.hasUsedChongsheng)btns.push({text:'🔥 发动【重生】',color:'#9b59b6',action:function(){closeModal();triggerSkill_Chongsheng();}});
    if(gameState.heroId==='sunliangcheng' && !gameState.hasUsedHuamao && gameState.myMaxHp > 1){
        btns.push({text:'🐱 发动【化猫】',color:'#e67e22',action:function(){closeModal();triggerSkill_Huamao();}});
    }
    btns.push({text:'放弃(阵亡)',color:'#e74c3c',action:function(){closeModal();checkWin();}});
    showModal('⚠️ 濒死','体力为0，请自救！',btns);
}

// [FIXED] Maoniang limited to 2 times per turn
function useSkill_Maoniang(){
    if(!gameState.isMyTurn || gameState.phase!=='play' || gameState.isProcessing || gameState.myHp <= 1 || gameState.hasUsedMaoniangCount >= 2) return;
    
    gameState.hasUsedMaoniangCount++;
    gameState.myHp -= 1;
    log('🎀 【猫娘】失去1点体力！('+gameState.hasUsedMaoniangCount+'/2)');
    
    dealDamageToEnemy(1);
    log('🎀 敌人也失去1点体力！');
    
    var gained = 0;
    if(gameState.enemyHand.length > 0){
        var ri = Math.floor(Math.random() * gameState.enemyHand.length);
        var stolen = gameState.enemyHand.splice(ri, 1)[0];
        gameState.myHand.push(stolen);
        gained++;
        log('🤏 夺取敌人 '+cardDesc(stolen));
    }
    
    if(gained > 0){
        drawCard('me', 3, false);
        log('📚 【猫娘】抢到牌了！再摸3张！');
    } else {
        if(gameState.myHp < gameState.myMaxHp){
            gameState.myHp++;
            log('💖 【猫娘】没抢到牌，回复1点体力。');
        }
    }
    
    renderBattle();
    checkWin();
}

/* ========== Duel System ========== */
function startDuel(a,d){gameState.isProcessing=true;gameState.duel={active:true,attacker:a,defender:d,currentTurn:d};log('⚔️ 决斗开始！');renderBattle();setTimeout(processDuelTurn,800);}
function processDuelTurn(){if(!gameState.duel.active||gameOver)return;var c=gameState.duel.currentTurn;if(c==='enemy'){var k=gameState.enemyHand.findIndex(function(x){return isKill(x);});if(k!==-1){var card=gameState.enemyHand.splice(k,1)[0];discardCard(card);enemyLoseCard(card,'play');log('🛡️ 敌人出'+cardDesc(card)+'反击！');gameState.duel.currentTurn='me';renderBattle();setTimeout(processDuelTurn,800);}else{log('❌ 敌人没杀了！');endDuel('me');}}else{showModal('⚔️ 决斗中','出杀或受1伤',[{text:'出【杀】',color:'#e74c3c',action:function(){var k=gameState.myHand.findIndex(function(x){return isKill(x);});if(k===-1){alert('没有杀！');return;}var card=gameState.myHand.splice(k,1)[0];discardCard(card);playerLoseCard(card,'play');log('🗡️ 你出'+cardDesc(card));closeModal();gameState.duel.currentTurn='enemy';renderBattle();setTimeout(processDuelTurn,800);}},{text:'放弃(受1伤)',color:'#7f8c8d',action:function(){log('❌ 放弃抵抗！');closeModal();endDuel('enemy');}}]);}}
function endDuel(w){gameState.duel.active=false;log('🏆 决斗结束！'+(w==='me'?'你':'敌人')+'胜！');if(w==='me'){dealDamageToEnemy(1);gameState.isProcessing=false;renderBattle();if(gameState.enemyHp>0&&!gameOver)finishEnemyTurnWithExtraCheck();}else{takeDamage(1);gameState.isProcessing=false;renderBattle();}}

/* ========== [FIX] Enemy Defend - Kill Resolution Chain ========== */

function enemyAI_AOE(){var n=gameState.enemyHand.findIndex(function(c){return c.effect==='nanman';}),w=gameState.enemyHand.findIndex(function(c){return c.effect==='wanjian';}),pht=gameState.myEquipment.armor&&gameState.myEquipment.armor.effect==='armor_tengjia',pDxg=gameState.heroId==='yuchengxiao';if(n!==-1&&!pht&&!pDxg&&gameState.myHand.length<=2){var c=gameState.enemyHand.splice(n,1)[0];discardCard(c);log('🐘 敌人南蛮！');gameState.isProcessing=true;var k=gameState.myHand.findIndex(function(c){return isKill(c);});if(k!==-1){var kc=gameState.myHand.splice(k,1)[0];discardCard(kc);log('🛡️ 你自动出'+cardDesc(kc)+'抵御');gameState.isProcessing=false;renderBattle();setTimeout(enemyAI_WineAndKill,800);}else{log('❌ 你无杀，受1伤！');takeDamage(1);gameState.isProcessing=false;renderBattle();setTimeout(function(){if(!gameOver)enemyAI_WineAndKill();},1000);}return;}if(w!==-1&&!pht&&!pDxg&&gameState.myHand.length<=2){var c=gameState.enemyHand.splice(w,1)[0];discardCard(c);log('🏹 敌人万箭！');gameState.isProcessing=true;var d=gameState.myHand.findIndex(function(c){return c.effect==='dodge';});if(d!==-1){var dc=gameState.myHand.splice(d,1)[0];discardCard(dc);log('🛡️ 你自动出'+cardDesc(dc)+'躲避');gameState.isProcessing=false;renderBattle();setTimeout(enemyAI_WineAndKill,800);}else{log('❌ 你无闪，受1伤！');takeDamage(1);gameState.isProcessing=false;renderBattle();setTimeout(function(){if(!gameOver)enemyAI_WineAndKill();},1000);}return;}setTimeout(enemyAI_WineAndKill,500);}
function enemyAI_WineAndKill(){if(gameOver)return;var hasW=!!gameState.enemyEquipment.weapon,ekl=1;if(gameState.enemyHeroId==='wangsheng')ekl=4;if(gameState.enemyHeroId==='xuzongwei'||gameState.enemyHeroId==='yuchengxiao')ekl=999;if(gameState.enemyHeroId==='manhongyi'&&gameState.enemyArmor>0&&!gameState.enemyHasUsedBeici){var kI2=gameState.enemyHand.findIndex(function(c){return isKill(c);});if(kI2!==-1){gameState.enemyArmor-=1;gameState.enemyHasUsedBeici=true;ekl+=1;log('🗡️ 敌人背刺！');if(gameState.myHand.length>0){var ri=Math.floor(Math.random()*gameState.myHand.length);var sc=gameState.myHand.splice(ri,1)[0];gameState.enemyHand.push(sc);log('🤏 敌人夺你一牌');}log('🚫 你无法出闪！');renderBattle();var kc=gameState.enemyHand.splice(kI2,1)[0];discardCard(kc);enemyLoseCard(kc,'play');var dmg=gameState.enemyHasUsedWine?2:1;if(gameState.enemyDamageBonus>0)dmg+=gameState.enemyDamageBonus;gameState.enemyKillCountThisTurn++;log('⚔️ 敌人'+cardDesc(kc)+'(伤害:'+dmg+')');renderBattle();setTimeout(function(){handleEnemyKillHit(dmg,kc);},800);return;}}var cuk=gameState.enemyKillCountThisTurn<ekl||hasW;if(cuk&&!gameState.enemyHand.some(function(c){return isKill(c);})&&gameState.enemyHand.length>=2&&gameState.enemyEquipment.weapon&&gameState.enemyEquipment.weapon.effect==='weapon_zhangba'){var c1=gameState.enemyHand.splice(0,1)[0],c2=gameState.enemyHand.splice(0,1)[0];discardCard(c1);discardCard(c2);enemyLoseCard(c1,'play');enemyLoseCard(c2,'play');log('🐍 敌人丈八！');gameState.enemyKillCountThisTurn++;var fk={};var src=cardEffects.kill;for(var k in src)fk[k]=src[k];fk.id=Date.now();fk.suit='♠';fk.rank='A';setTimeout(function(){playerDefend(1,fk);},800);return;}var kI=-1,ia=false;if(gameState.enemyEquipment.weapon&&gameState.enemyEquipment.weapon.effect==='weapon_qinggang')ia=true;var prw=!ia&&gameState.myEquipment.armor&&gameState.myEquipment.armor.effect==='armor_renwang';var pht=!ia&&gameState.myEquipment.armor&&gameState.myEquipment.armor.effect==='armor_tengjia';if(pht){kI=gameState.enemyHand.findIndex(function(c){return c.effect==='fire_damage';});if(kI===-1)kI=gameState.enemyHand.findIndex(function(c){return c.effect==='thunder_damage';});}else if(prw)kI=gameState.enemyHand.findIndex(function(c){return isKill(c)&&getSuitColor(c.suit)==='suit-red';});else kI=gameState.enemyHand.findIndex(function(c){return isKill(c);});var ac=null;if(kI!==-1){ac=gameState.enemyHand[kI];if(gameState.enemyEquipment.weapon&&gameState.enemyEquipment.weapon.effect==='weapon_zhuque'&&ac.effect==='damage'){ac={};for(var k in gameState.enemyHand[kI])ac[k]=gameState.enemyHand[kI][k];ac.name='火杀';ac['class']='fire_kill';ac.effect='fire_damage';log('🔥 朱雀当火杀！');}}if(kI!==-1&&cuk){var wi=gameState.enemyHand.findIndex(function(c){return c.effect==='wine';});if(wi!==-1&&!gameState.enemyHasUsedWine){var wc=gameState.enemyHand.splice(wi,1)[0];discardCard(wc);gameState.enemyHasUsedWine=true;log('🍷 敌人饮酒！');renderBattle();}setTimeout(function(){var kc=gameState.enemyHand.splice(kI,1)[0];discardCard(kc);enemyLoseCard(kc,'play');var dmg=gameState.enemyHasUsedWine?2:1;if(gameState.enemyDamageBonus>0)dmg+=gameState.enemyDamageBonus;gameState.enemyKillCountThisTurn++;log('⚔️ 敌人'+cardDesc(ac)+'(伤害:'+dmg+')');gameState.enemyHasUsedKill=true;renderBattle();playerDefend(dmg,ac);},800);}else finishEnemyTurnWithExtraCheck();}
function finishEnemyTurnWithExtraCheck(){if(gameOver)return;if(gameState.enemyHeroId==='xuzongwei'&&!gameState.enemyExtraTurn){gameState.enemyExtraTurn=true;log('⏳ 敌人【当先】第二回合！');renderBattle();setTimeout(startEnemyTurn,1000);}else{gameState.enemyExtraTurn=false;enemyDiscardPhase();}}
function finishEnemyTurn(){gameState.skipDraw=false;gameState.skipPlay=false;log('--- 敌人回合结束 ---');renderBattle();setTimeout(startMyTurn,1000);}

/* ========== [FIX] Player Defend vs Enemy Kill - 彻底解决闪避后AI断链 ========== */
function playerDefend(dmg,ac){if(gameOver)return;if(gameState.myImmuneKill){log('🛡️ ♣免疫杀！');closeModal();handleEnemyKillDodged(dmg,ac);return;}var ia=false;if(gameState.enemyEquipment.weapon&&gameState.enemyEquipment.weapon.effect==='weapon_qinggang'){ia=true;log('⚔️ 青釭无视防具！');}if(!ia&&gameState.myEquipment.armor&&gameState.myEquipment.armor.effect==='armor_tengjia'&&ac.effect==='damage'){log('🌿 藤甲免疫！');closeModal();handleEnemyKillDodged(dmg,ac);return;}if(!ia&&gameState.myEquipment.armor&&gameState.myEquipment.armor.effect==='armor_renwang'&&getSuitColor(ac.suit)==='suit-black'){log('🛡️ 仁王盾免疫！');closeModal();handleEnemyKillDodged(dmg,ac);return;}if(!ia&&gameState.myEquipment.armor&&gameState.myEquipment.armor.effect==='armor_bagua'){var jc=null;if(drawPile.length===0&&discardPile.length>0){drawPile=discardPile.slice();discardPile=[];shuffleArray(drawPile);}if(drawPile.length>0)jc=drawPile.pop();if(jc){log('☯️ 八卦判定：'+jc.suit+jc.rank);discardCard(jc);if(getSuitColor(jc.suit)==='suit-red'){log('☯️ 红色生效！');closeModal();handleEnemyKillDodged(dmg,ac);return;}else log('☯️ 黑色未生效。');}}var btns=[];if(gameState.heroId==='yuchengxiao'&&gameState.myShouban>0)btns.push({text:'手办当闪',color:'#ff6b81',action:function(){gameState.myShouban--;log('🎀 手办当闪！');closeModal();renderBattle();handleEnemyKillDodged(dmg,ac);}});var di=gameState.myHand.findIndex(function(c){return c.effect==='dodge';});if(di!==-1){btns.push({text:'出【闪】',color:'#3498db',action:function(){var fdi=gameState.myHand.findIndex(function(c2){return c2.effect==='dodge';});if(fdi===-1){alert('没有闪！');return;}var dc=gameState.myHand.splice(fdi,1)[0];discardCard(dc);log('🛡️ 出'+cardDesc(dc)+'闪避！');closeModal();renderBattle();handleEnemyKillDodged(dmg,ac);}});}if(gameState.heroId==='wangsheng'&&!gameState.hasUsedFanke&&!gameState.duel.active&&gameState.myHand.some(function(c){return isKill(c);}))btns.unshift({text:'反客为主(弃杀反伤)',color:'#8e44ad',action:function(){var ki=gameState.myHand.findIndex(function(c){return isKill(c);});var kc=gameState.myHand.splice(ki,1)[0];discardCard(kc);playerLoseCard(kc,'discard');gameState.hasUsedFanke=true;gameState.enemyHp-=1;log('🔄 反客为主！敌人-1血');renderBattle();checkWin();closeModal();handleEnemyKillDodged(dmg,ac);}});btns.push({text:'不出闪(受'+dmg+'伤)',color:'#7f8c8d',action:function(){log('❌ 受'+dmg+'伤！');closeModal();handleEnemyKillHit(dmg,ac);}});showModal('⚠️ 敌人杀你！','出闪抵消'+dmg+'点伤害',btns);}
function handleEnemyKillDodged(dmg,ac){
    if(gameState.enemyEquipment.weapon && gameState.enemyEquipment.weapon.effect==='weapon_qinglong' && gameState.enemyHand.some(function(c){return isKill(c);})){
        gameState.isProcessing=true;
        setTimeout(function(){
            var kI=gameState.enemyHand.findIndex(function(c){return isKill(c);});
            if(kI!==-1){
                var kc=gameState.enemyHand.splice(kI,1)[0];
                discardCard(kc);
                enemyLoseCard(kc,'play');
                gameState.enemyKillCountThisTurn++;
                log('🐉 敌人【青龙偃月刀】追加'+cardDesc(kc)+'！');
                renderBattle();
                setTimeout(function(){ playerDefend(dmg,kc); },800);
            } else {
                gameState.isProcessing=false;
                renderBattle();
                setTimeout(enemyAI_WineAndKill, 500);
            }
        }, 800);
        return;
    }
    gameState.isProcessing = false;
    renderBattle();
    setTimeout(enemyAI_WineAndKill, 500);
}
function handleEnemyKillHit(dmg,ac){if(gameState.enemyEquipment.weapon&&gameState.enemyEquipment.weapon.effect==='weapon_guding'&&gameState.myHand.length===0){dmg+=1;log('🔪 古锭刀+1！');}if(gameState.myEquipment.armor&&gameState.myEquipment.armor.effect==='armor_tengjia'&&ac.effect==='fire_damage'){dmg+=1;log('🔥 藤甲火伤+1！');}if(gameState.enemyEquipment.weapon&&gameState.enemyEquipment.weapon.effect==='weapon_hanbing'){log('❄️ 寒冰剑弃你2牌！');var dn=0,nm=[];while(dn<2&&gameState.myHand.length>0){var ri=Math.floor(Math.random()*gameState.myHand.length);var dc=gameState.myHand.splice(ri,1)[0];discardCard(dc);playerLoseCard(dc,'discard');nm.push(dc.name);dn++;}if(dn>0)log('🗑️ 你弃：'+nm.join('、'));gameState.isProcessing=false;renderBattle();setTimeout(enemyAI_WineAndKill,500);return;}takeDamage(dmg);gameState.isProcessing=false;renderBattle();setTimeout(function(){if(!gameOver)enemyAI_WineAndKill();},500);}
